# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: "%env(APP_SECRET)%"

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    rate_limiter:
        # Rate limiter for authentication endpoints (register, verify-email, resend-verification)
        auth_endpoint:
            policy: "sliding_window"
            limit: 3
            interval: "15 minutes"

        # Rate limiter specifically for login attempts (separate quota from other auth endpoints)
        login:
            policy: "sliding_window"
            limit: 3
            interval: "15 minutes"

        # Rate limiter for password reset requests
        password_reset:
            policy: "sliding_window"
            limit: 2
            interval: "30 minutes"

        # Rate limiter for email change requests
        email_change:
            policy: "sliding_window"
            limit: 2
            interval: "30 minutes"

        # Rate limiter for password change requests
        password_change:
            policy: "sliding_window"
            limit: 5
            interval: "30 minutes"

        # Rate limiter for account deletion requests
        account_deletion:
            policy: "sliding_window"
            limit: 2
            interval: "1 hour"

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
