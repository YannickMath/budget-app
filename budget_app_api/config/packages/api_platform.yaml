api_platform:
    title: Budget App API
    description: 'API REST pour la gestion de budget personnel avec authentification JWT'
    version: 1.0.0

    defaults:
        stateless: true
        cache_headers:
            vary: ["Content-Type", "Authorization", "Origin"]

    formats:
        json: ["application/json"]

    error_formats:
        json: ["application/json"]

    # Configuration OpenAPI
    openapi:
        contact:
            name: 'Budget App Support'
            email: 'support@budgetapp.com'

    # Configuration Swagger/OpenAPI
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header

        # Configuration Swagger UI
        swagger_ui_extra_configuration:
            # Garde le token JWT après rafraîchissement
            persist_authorization: true
            # Permet d'essayer les requêtes
            try_it_out_enabled: true
            # Filtre par tags
            filter: true
            # Syntaxe highlight
            syntax_highlight:
                activated: true
                theme: 'monokai'
