framework:
    messenger:
        # Send failed messages to this transport for later handling
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            failed: 'doctrine://default?queue_name=failed'

        routing:
            # Route async messages to the async transport
            'App\Message\CleanupExpiredTokensMessage': async
            'App\Message\CleanupOldAuditsMessage': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
